[package]
name = "dreamcore"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["shared/abi", "userland/api"]
resolver = "2"

[dependencies]
limine = "0.5.0"
imagineos-abi = { path = "shared/abi" }

[[bin]]
name = "dreamcore"
path = "dnu/main.rs"

[[bin]]
name = "bootstrap"
path = "dnu/bootstrap.rs"
test = false
bench = false

[features]
kernel-debug = []
bootstrap = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1